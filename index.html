<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title> Pagina de Login </title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="principal">
        <header class="barra-navegacao">
            <img src="assets/img/riot-logo.png" alt="Logo da pagina de games" width="200">
        </header>

        <main class="digite-login">
            <span> SIGN IN </span>

            <div class="login">
                <form>
                    <label for="nome"></label>
                    <input type="text" id="nome" name="nome" placeholder="war D3N00">

                    <label for="senha"></label>
                    <input type="text" id="senha" name="senha" placeholder="PASSWORD">
                </form>
            </div>

            <div class="acoes">
                <span class="remember">Remember Me</span>
                <span class="forgot">Forgot Password?</span>
            </div>

            <div class="botao-vermelho">
                <button type="button">SIGN IN</button>
                <span>Don't have an account? <span>Sign Up</span> </span>
                <span> Or Sign In With</span>
            </div>

            <div class="formas-login">
                <button type="submit">Google</button>
                <button type="submit">XBOX</button>
            </div>
        </main>

    </div>

</body>

</html>
